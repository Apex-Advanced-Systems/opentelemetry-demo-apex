name: Apex agent characterization

on:
  push:
    branches: ['apex-experiment/**']
  pull_request:
    branches: ['apex-experiment/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  characterization:
    name: Agent characterization suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14.7'
      # Pins the frozen suite files. This workflow cannot hash itself; its own
      # digest is pinned out of band in the Apex profile.
      - name: Verify frozen suite digests
        run: |
          sha256sum -c --strict - <<'DIGESTS'
          94d9fa59cc48cc6e9fb58335a491fd6b16e51582736daef8c37a9ddefa9b11af  src/agent/tests/characterization/conftest.py
          cf59cfd7e697c5066e383d9b8aaad2ac936688250892d8a4bc3a9d56dd38a09e  src/agent/tests/characterization/pytest.ini
          627181a463e16178b030251bad4a15ad0dc9b2e30ffd898add41082883d4ef67  src/agent/tests/characterization/requirements-test.txt
          30f42aec072d47afee7dd62ae6c679b6d27c335a39310f3f01031e8586c6ef43  src/agent/tests/characterization/test_feature_flags.py
          73aa496a2b7234681ef8e4d861e851a14af06bbdb97548b9b6a8e0ee924967a8  src/agent/tests/characterization/test_patch_vcr.py
          d379b0618e59a6849672a91e0986e0f76ae375897c9f1d1a25401acef060dc78  src/agent/tests/characterization/test_sanitycheck.py
          b3b40a150f3eed0281c893314948ba05e3b357a8261c1cf28d9ae27f04b0aee3  src/agent/tests/characterization/test_shared_tools.py
          DIGESTS
      # The frozen suite is exactly these seven files: any added file under
      # src/agent/tests (for example a conftest or test module) fails. The suite
      # collects nothing outside src/agent/tests/characterization.
      - name: Verify frozen suite file set
        run: |
          expected='src/agent/tests/characterization/conftest.py
          src/agent/tests/characterization/pytest.ini
          src/agent/tests/characterization/requirements-test.txt
          src/agent/tests/characterization/test_feature_flags.py
          src/agent/tests/characterization/test_patch_vcr.py
          src/agent/tests/characterization/test_sanitycheck.py
          src/agent/tests/characterization/test_shared_tools.py'
          actual=$(find src/agent/tests -type f | LC_ALL=C sort)
          expected=$(printf '%s\n' "$expected" | sed 's/^ *//' | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            echo "unexpected file set under src/agent/tests:"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
      - name: Install pinned service and test requirements
        run: |
          python -m pip install --require-hashes -r src/agent/requirements.txt
          python -m pip install --require-hashes -r src/agent/tests/characterization/requirements-test.txt
      - name: Run characterization suite
        env:
          # The suite needs no plugins; refuse plugins pulled in by service deps.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -B -m pytest src/agent/tests/characterization -q -p no:cacheprovider
