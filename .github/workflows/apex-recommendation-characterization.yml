name: Apex recommendation characterization

on:
  push:
    branches: [apex-overlay, 'apex-experiment/**']
  pull_request:
    branches: [apex-overlay, 'apex-experiment/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  characterization:
    name: Recommendation characterization suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14.7'
      # Pins the frozen suite files. This workflow cannot hash itself; its own
      # digest is pinned out of band in the Apex profile.
      - name: Verify frozen suite digests
        run: |
          sha256sum -c --strict - <<'DIGESTS'
          a5cdd45c86e4e2b09b4936a83cc715e44cb95f1242b1770656c052f7e99a1c41  src/recommendation/tests/characterization/conftest.py
          c67a251e4a3c87b20e442c37665f3907b55b18f6914f42f0ef14713ecb92c754  src/recommendation/tests/characterization/pytest.ini
          985a5392c678a103d1ee522fa19c61d56431a868e4005d6b14de022150a19620  src/recommendation/tests/characterization/requirements-test.txt
          b284ce703d5a7ad6458913988661f3915976e31cbea0159487cba39234e80b19  src/recommendation/tests/characterization/test_health.py
          5c08996c9d6854be0a56a25dae4c80d562105c66f81415ec001a21aaa8b1f095  src/recommendation/tests/characterization/test_list_recommendations.py
          DIGESTS
      # The frozen suite is exactly these five files: any added file under
      # src/recommendation/tests (for example a conftest or test module) fails.
      - name: Verify frozen suite file set
        run: |
          expected='src/recommendation/tests/characterization/conftest.py
          src/recommendation/tests/characterization/pytest.ini
          src/recommendation/tests/characterization/requirements-test.txt
          src/recommendation/tests/characterization/test_health.py
          src/recommendation/tests/characterization/test_list_recommendations.py'
          actual=$(find src/recommendation/tests -type f | LC_ALL=C sort)
          expected=$(printf '%s\n' "$expected" | sed 's/^ *//' | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            echo "unexpected file set under src/recommendation/tests:"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
      - name: Install pinned service and test requirements
        run: |
          python -m pip install --require-hashes -r src/recommendation/requirements.txt
          python -m pip install --require-hashes -r src/recommendation/tests/characterization/requirements-test.txt
      - name: Run characterization suite
        env:
          # The suite needs no plugins; refuse plugins pulled in by service deps.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -B -m pytest src/recommendation/tests/characterization -q -p no:cacheprovider
